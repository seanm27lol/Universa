<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" font-family="system-ui,-apple-system,&quot;Segoe UI&quot;,sans-serif" role="img" aria-label="Per-condition accuracy for four arms across three conditions.">
<rect width="900" height="540" fill="#fcfcfb"/>
<text x="92" y="34" font-size="19" font-weight="600" fill="#0b0b0b">Two arms can never acquire a missing structure — by construction</text>
<text x="92" y="56" font-size="13.5" fill="#52514e">Accuracy per condition, 36 sealed seeds, loop-v4. The two zeros are design constants, not training failures.</text>
<rect x="92" y="72" width="11" height="11" rx="2.5" fill="#2a78d6"/>
<text x="109" y="82" font-size="12.5" fill="#52514e">full architecture</text>
<rect x="237.0" y="72" width="11" height="11" rx="2.5" fill="#eb6834"/>
<text x="254.0" y="82" font-size="12.5" fill="#52514e">routing only</text>
<rect x="347.0" y="72" width="11" height="11" rx="2.5" fill="#1baf7a"/>
<text x="364.0" y="82" font-size="12.5" fill="#52514e">always discover</text>
<rect x="478.0" y="72" width="11" height="11" rx="2.5" fill="#eda100"/>
<text x="495.0" y="82" font-size="12.5" fill="#52514e">no architecture</text>
