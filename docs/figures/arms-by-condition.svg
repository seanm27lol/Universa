<rect x="139.8" y="398.0" width="45.8" height="6.0" fill="#eb6834"/>
<text x="162.8" y="117.9" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="400" font-variant-numeric="tabular-nums">97%</text>
