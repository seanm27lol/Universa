<rect x="806.2" y="149.8" width="45.8" height="254.2" rx="4" fill="#eda100"/>
<rect x="806.2" y="398.0" width="45.8" height="6.0" fill="#eda100"/>
<text x="829.1" y="141.8" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="400" font-variant-numeric="tabular-nums">89%</text>
<text x="757.3" y="430.0" font-size="13.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">null control</text>
<text x="757.3" y="448.0" font-size="12" fill="#898781" text-anchor="middle">there is no structure</text>
<text x="92" y="490" font-size="12.5" fill="#52514e">Routing-only has no discovery channel and the no-architecture model has no certified synthesis channel, so neither can</text>
<text x="92" y="508" font-size="12.5" fill="#52514e">ever acquire a withheld structure — that leg is a property of the design, and the protocol declares it before any data.</text>
<text x="92" y="532" font-size="12" fill="#898781">The full architecture reaches this with 71 discovery calls; always-discover needs 108.</text>
</svg>
