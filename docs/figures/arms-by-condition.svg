<rect x="235.5" y="398.0" width="45.8" height="6.0" fill="#eda100"/>
<text x="258.4" y="229.2" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="400" font-variant-numeric="tabular-nums">58%</text>
<text x="186.7" y="430.0" font-size="13.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">in-library</text>
<text x="186.7" y="448.0" font-size="12" fill="#898781" text-anchor="middle">the structure is in the library</text>
<rect x="377.3" y="125.9" width="45.8" height="278.1" rx="4" fill="#2a78d6"/>
<rect x="377.3" y="398.0" width="45.8" height="6.0" fill="#2a78d6"/>
<text x="400.3" y="117.9" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="400" font-variant-numeric="tabular-nums">97%</text>
